name: Deploy homepage and Western Sichuan roadbook

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/western-sichuan/pnpm-lock.yaml
      - uses: actions/configure-pages@v5
      - name: Build roadbook
        working-directory: app/western-sichuan
        env:
          VITE_AMAP_KEY: ${{ vars.VITE_AMAP_KEY }}
          VITE_AMAP_SECURITY_CODE: ${{ vars.VITE_AMAP_SECURITY_CODE }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Assemble Pages artifact
        run: |
          mkdir -p site-publish
          rsync -a --exclude '.git' --exclude '.github' --exclude 'app' --exclude 'site-publish' --exclude 'western-sichuan' ./ site-publish/
          cp -R western-sichuan site-publish/western-sichuan
          touch site-publish/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-publish
      - id: deployment
        uses: actions/deploy-pages@v4
